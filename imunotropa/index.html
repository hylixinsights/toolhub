<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0304">
<title>ImunoTropa: Defesa Celular</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{ --ac:#ff6b4a; }
*{box-sizing:border-box}
html,body{width:100%;height:100%;min-height:100%}
body{margin:0; background:#0a0304; overflow:hidden; color:#eaf6ff;
  font-family:'Orbitron',ui-monospace,Menlo,monospace;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; overscroll-behavior:none;}
@supports (height:100dvh){html,body{height:100dvh;min-height:100dvh}}
canvas{position:fixed; inset:0; display:block; touch-action:none}
.scan{pointer-events:none; position:fixed; inset:0; z-index:5;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px);}
#hud{position:fixed; top:0; left:0; right:0; z-index:6; pointer-events:none;
  padding:calc(6px + env(safe-area-inset-top)) 10px 4px;
  display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
#hleft{display:flex; flex-direction:column; gap:2px; min-width:0; max-width:64vw}
#ph{font-size:8px; letter-spacing:.14em; color:#7b8aa8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#cell{font-size:12px; letter-spacing:.04em; color:var(--ac); font-weight:900;
  text-shadow:0 0 8px var(--ac); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#mol{font-size:8px; letter-spacing:.05em; color:#9fb4d8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#tgt{font-size:8px; letter-spacing:.03em; color:#ffb38a; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#tgt b{color:#ffd0b0}
#pips{display:none}
.pip{width:14px; height:8px; background:var(--ac); box-shadow:0 0 6px var(--ac);
  clip-path:polygon(2px 0,100% 0,calc(100% - 2px) 100%,0 100%)}
.pip.off{background:#1c2742; box-shadow:none}
/* As três barras do HUD usam TEXTURAS diferentes, não só cores.
   O medidor muda de cor conforme a fase, então matiz sozinha não bastaria —
   e a textura ainda distingue as barras em escala de cinza ou para daltônicos.
   VIDA = preenchimento sólido · TECIDO = hachurado · MEDIDOR = segmentado. */
#cellhealth{display:none;margin-top:5px;width:150px;max-width:58vw}
#cellhealthlbl{font-size:7px;letter-spacing:.08em;margin-bottom:2px;color:#5ce8a4;transition:color .15s ease}
#cellhealthbar{height:7px;background:#0d1a15;border:1px solid #2c4a3e}
#cellhealthfill{height:100%;width:100%;background:#5ce8a4;box-shadow:0 0 7px #5ce8a4;
  transition:width .15s ease,background .15s ease,box-shadow .15s ease}
#tissue{display:none;margin-top:5px;width:150px;max-width:58vw}
#tissuelbl{font-size:7px;letter-spacing:.08em;margin-bottom:2px;color:#c8dcec;transition:color .2s ease}
#tissuebar{height:7px;background:#101627;border:1px solid #2e3d5e}
#tissuefill{--tc:#c8dcec; height:100%;width:100%;
  background:repeating-linear-gradient(115deg,var(--tc) 0 4px,rgba(6,10,22,.30) 4px 6px);
  box-shadow:0 0 7px var(--tc); transition:width .2s ease}
#meterwrap{margin-top:4px; display:none}
#meterlbl{font-size:7px; letter-spacing:.06em; color:#c3d2ee; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#meterbar{height:4px; width:120px; max-width:60vw; background:#111b2c; border:1px solid #2a3a5c;
  clip-path:polygon(3px 0,100% 0,calc(100% - 3px) 100%,0 100%)}
#meterfill{height:100%; width:0%; background:var(--ac); box-shadow:0 0 5px var(--ac); opacity:.88;
  -webkit-mask-image:repeating-linear-gradient(90deg,#000 0 5px,transparent 5px 7px);
  mask-image:repeating-linear-gradient(90deg,#000 0 5px,transparent 5px 7px)}
#hmid{text-align:center}
#score{font-size:16px; font-weight:900; letter-spacing:.06em; text-shadow:0 0 10px rgba(234,246,255,.5)}
#hi{font-size:8px; letter-spacing:.12em; color:#7b8aa8}
#hright{display:flex; gap:6px}
.hbtn{pointer-events:auto; width:34px; height:34px; border:1px solid #26365c; background:rgba(10,17,34,.7);
  color:#eaf6ff; font-size:14px; display:flex; align-items:center; justify-content:center;
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.hbtn:active{background:#16223f}
#bosswrap{position:fixed; left:12px; right:12px; z-index:6; pointer-events:none;
  top:calc(90px + env(safe-area-inset-top)); display:none}   /* valor inicial; o JS reposiciona abaixo do HUD */
#bossnm{font-size:9px; letter-spacing:.12em; text-align:center; color:#ff5c7a; text-shadow:0 0 8px #ff2b4d; margin-bottom:3px}
#bossbar{height:7px; background:#160a12; border:1px solid #4d1626; clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}
#bossfill{height:100%; width:100%; background:linear-gradient(90deg,#ff2b4d,#ff8a2a); box-shadow:0 0 8px #ff2b4d}
#special{position:fixed; left:12px; bottom:calc(14px + env(safe-area-inset-bottom));
  z-index:7; display:none; pointer-events:none; opacity:0;
  width:min(36vw,138px); min-height:58px; padding:10px 8px; border:0; cursor:pointer;
  font-family:inherit; font-weight:900; font-size:11px; line-height:1.2; letter-spacing:.07em; color:#2a0813;
  background:linear-gradient(90deg,#ffd34a,#ff8a2a); box-shadow:0 0 22px rgba(255,138,42,.6);
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  transition:opacity .22s ease}
#special.rdy{opacity:1; pointer-events:auto; animation:pulseSp 0.7s ease-in-out infinite}
#special:active{filter:brightness(1.15)}
/* sonda: lê o safe-area inferior em px para reservar a faixa do botão */
#sab{position:fixed; left:0; bottom:0; width:1px; height:env(safe-area-inset-bottom);
  pointer-events:none; opacity:0}
@keyframes pulseSp{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#coach{position:fixed; left:50%; top:38%; transform:translate(-50%,-50%); z-index:8; display:none;
  width:min(84vw,390px); padding:12px 14px; text-align:center; pointer-events:none; color:#eaf6ff;
  background:rgba(5,10,22,.92); border:1px solid var(--ac); font-size:11px; line-height:1.55;
  box-shadow:0 0 22px color-mix(in srgb,var(--ac) 38%,transparent)}
#coach b{display:block;color:var(--ac);font-size:9px;letter-spacing:.14em;margin-bottom:4px}
body.contrast .scan{display:none}
body.contrast canvas{filter:contrast(1.18) saturate(1.12)}
body.contrast .hbtn,body.contrast .card{border:1px solid #d8e8ff}
/* Alto contraste: bordas mais fortes e hachura mais marcada nas barras */
body.contrast #cellhealthbar,body.contrast #tissuebar,body.contrast #meterbar{border:1px solid #cfe2ff}
body.contrast #tissuefill{background:repeating-linear-gradient(115deg,var(--tc) 0 4px,#04060e 4px 6px)}
#ovl{position:fixed; inset:0; z-index:10; display:flex; align-items:flex-start; justify-content:center;
  background:rgba(4,7,13,.86); backdrop-filter:blur(5px);
  padding:calc(12px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom));
  overflow-x:hidden; overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y; overscroll-behavior:contain}
#ovl.hide{display:none}
.card{width:min(90vw,430px); padding:22px 20px; text-align:center;
  flex:0 0 auto; margin:auto 0;
  background:linear-gradient(180deg,#0a1122,#070b18);
  clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
  box-shadow:0 0 0 1px #1b2a4d, 0 0 34px rgba(0,0,0,.6)}
.card.menuCard{width:min(94vw,500px);padding:10px 12px 16px}
.heroart{display:block;width:100%;max-height:49vh;object-fit:contain;background:#090713;margin:0 auto 9px}
.diffrow{display:flex;gap:7px}.diffrow .btn{margin-top:5px;padding:11px 5px;font-size:10px;letter-spacing:.07em}
.eyebrow{font-size:9px; letter-spacing:.24em; color:#7b8aa8; margin-bottom:8px}
h1{margin:0; font-size:25px; font-weight:900; letter-spacing:.06em; line-height:1.15;
  color:#fff; text-shadow:0 0 14px var(--ac), 0 0 40px var(--ac)}
h2{margin:0; font-size:18px; font-weight:900; letter-spacing:.08em; color:#fff; text-shadow:0 0 12px var(--ac)}
.txt{font-size:11px; line-height:1.7; color:#b9c8e4; margin:13px 0 4px; font-weight:500}
.txt b{color:#eaf6ff}
.big{font-size:13px; color:var(--ac); font-weight:900; letter-spacing:.05em; margin:6px 0}
.arc{text-align:left; font-size:10px; line-height:1.5; color:#c3d2ee; margin:12px 0;
  border:1px solid #1b2a4d; border-radius:2px; padding:9px 11px; background:rgba(8,14,28,.5)}
.arc div{margin:3px 0; white-space:normal; overflow:visible}
.arc b{color:#fff}
.lz{text-align:left; font-size:11px; line-height:1.55; color:#c6d4ee; margin:9px 0; border-left:2px solid #3a2530; padding-left:10px}
.lz .lk{display:block; font-size:9px; letter-spacing:.12em; font-weight:900; margin-bottom:2px}
.lz b{color:#fff}
.chip{display:inline-block; padding:1px 7px; border-radius:10px; font-size:9px; font-weight:900; letter-spacing:.06em; vertical-align:middle}
.num{display:inline-block; width:15px; color:#7b8aa8}
.stat{font-size:12px; letter-spacing:.08em; color:#b9c8e4; margin-top:10px}
.stat span{color:#fff; font-weight:900}
.btn{display:block; width:100%; margin-top:12px; padding:14px 10px; border:0; cursor:pointer;
  font-family:inherit; font-weight:900; font-size:13px; letter-spacing:.14em; color:#04070d;
  background:linear-gradient(90deg,var(--ac),#fff 170%);
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  box-shadow:0 0 18px color-mix(in srgb, var(--ac) 55%, transparent)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent; color:#9fb4d8; box-shadow:inset 0 0 0 1px #26365c; font-size:12px; padding:11px}
.btn,.hbtn,.creator-sign,.support-logo{touch-action:manipulation}
.note{font-size:9px; letter-spacing:.05em; color:#5f6f92; margin-top:12px; line-height:1.6}
.signal-guide{margin:10px 0 4px;padding:9px 10px;border:1px solid #283956;background:rgba(5,10,22,.72);text-align:left;font-size:9px;line-height:1.55;color:#b9c8e4}
.signal-guide div+div{margin-top:5px}
.signal-guide b{color:#eaf6ff}
.signal-dot{display:inline-block;width:9px;height:9px;margin-right:7px;border-radius:50%;vertical-align:-1px}
.signal-dot.danger{background:#ff5c7a;box-shadow:0 0 8px #ff5c7a}
.signal-dot.heal{background:#62f0a8;box-shadow:0 0 8px #62f0a8}
.creator-sign{display:inline-block;margin:8px 0 1px;color:#8fa0c0;font-size:9px;letter-spacing:.08em;text-decoration:none}
.creator-sign b{color:#dbe8ff}.creator-sign:active{color:var(--ac)}
.credit-block{margin:12px 0;padding:12px;border:1px solid #1b2a4d;background:rgba(4,8,17,.55);text-align:left}
.credit-label{display:block;margin-bottom:7px;color:#ffd34a;font-size:9px;font-weight:900;letter-spacing:.15em}
.credit-name{color:#eaf6ff;font-size:12px;line-height:1.55}.credit-name a{color:#fff;text-decoration:none}
.credit-sub{color:#8293b3;font-size:9px;line-height:1.5}
.realization{border-color:#164d69;text-align:center;background:linear-gradient(180deg,rgba(9,27,42,.9),rgba(4,8,17,.8))}
.realization .credit-label{color:#66f0ff}.realization a{display:block;text-decoration:none;color:#fff}
.realization img{display:block;width:auto;height:135px;max-width:82%;object-fit:contain;margin:5px auto 9px;background:transparent}
.credit-block.supports{padding:12px 10px 10px}
.support-grid{display:flex;flex-direction:column;padding:2px 10px;background:transparent}
.support-logo{display:flex;width:100%;min-height:102px;padding:15px 4px;align-items:center;justify-content:center;background:transparent;border:0;border-top:1px solid #1b2a4d;text-decoration:none;overflow:hidden}
.support-logo img{display:block;width:94%;height:82px;object-fit:contain;object-position:center}
.support-logo.featured{min-height:140px;padding:4px 4px 18px;border-top:0}.support-logo.featured img{width:98%;height:116px}
.credit-hint{margin:7px 0 0;color:#5f6f92;font-size:8px;letter-spacing:.06em;text-align:center}
/* --- compartilhar / desafiar --- */
.btn.share{background:linear-gradient(90deg,#25d366,#4aa8ff 175%); color:#04140a}
.btn.wa{background:linear-gradient(90deg,#25d366,#128c7e 170%); color:#04140a}
.btn.ig{background:linear-gradient(90deg,#feda75,#d62976 55%,#962fbf 110%); color:#fff}
.srow{display:flex; gap:8px; margin-top:10px}
.srow .btn{margin-top:0}
.badge{display:inline-block; margin:10px auto 2px; padding:4px 12px; font-size:10px; font-weight:900; letter-spacing:.12em;
  color:#04140a; background:linear-gradient(90deg,#ffd34a,#ff8a2a); border-radius:20px; box-shadow:0 0 16px rgba(255,138,42,.6);
  animation:badgePop .5s ease}
@keyframes badgePop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
#toast{position:fixed; left:50%; bottom:calc(88px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(14px);
  z-index:30; pointer-events:none; opacity:0; transition:opacity .18s ease, transform .18s ease;
  background:rgba(8,16,30,.95); color:#eaf6ff; border:1px solid #2a3a5c; font-size:12px; font-weight:900; letter-spacing:.06em;
  padding:10px 16px; clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); box-shadow:0 8px 26px rgba(0,0,0,.5)}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
#share{position:fixed; inset:0; z-index:20; display:flex; align-items:flex-start; justify-content:center;
  background:rgba(3,6,12,.9); backdrop-filter:blur(6px);
  padding:calc(12px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom));
  overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
#share.hide{display:none}
#score.pop{animation:scorePop .28s ease}
body.lowfx #ovl,body.lowfx #share{backdrop-filter:none}
body.lowfx .scan{display:none}
body.lowfx #special{box-shadow:none;animation:none}
body.lowfx .card{box-shadow:0 0 0 1px #1b2a4d}
@keyframes scorePop{0%{transform:scale(1)}45%{transform:scale(1.22); text-shadow:0 0 16px var(--ac)}100%{transform:scale(1)}}
@media (max-height:540px){
  .card{padding:14px 15px}
  h1{font-size:20px} h2{font-size:15px}
  .btn{padding:11px 10px; margin-top:9px} .btn.ghost{padding:9px}
  .txt{margin:8px 0 3px; line-height:1.55} .arc{margin:8px 0} .lz{margin:7px 0}
  #special{bottom:calc(10px + env(safe-area-inset-bottom)); min-height:48px; padding:8px 7px; font-size:10px}
}
@media (max-width:600px){
  .card{margin:0}
}
@media (max-width:390px){
  .card{width:min(94vw,430px);padding:18px 14px}
  .card.menuCard{padding:8px 9px 14px}
  .heroart{max-height:43vh}
  .diffrow{gap:5px}.diffrow .btn{padding:10px 2px;font-size:9px;letter-spacing:.035em}
}
@media (prefers-reduced-motion:reduce){
  #special,#special.rdy{animation:none}
  #score.pop,.badge{animation:none}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="scan"></div>

<div id="hud">
  <div id="hleft">
    <div id="ph"></div>
    <div id="cell"></div>
    <div id="mol"></div>
    <div id="tgt"></div>
    <div id="pips"></div>
    <div id="cellhealth"><div id="cellhealthlbl">VIDA DA CÉLULA 100%</div><div id="cellhealthbar"><div id="cellhealthfill"></div></div></div>
    <div id="tissue"><div id="tissuelbl">INTEGRIDADE DO TECIDO 100%</div><div id="tissuebar"><div id="tissuefill"></div></div></div>
    <div id="meterwrap"><div id="meterlbl"></div><div id="meterbar"><div id="meterfill"></div></div></div>
  </div>
  <div id="hmid"><div id="score">0</div><div id="hi"></div></div>
<div id="hright"><button class="hbtn" id="bSnd" aria-label="Ativar ou desativar som">♪</button><button class="hbtn" id="bPause" aria-label="Pausar jogo">Ⅱ</button></div>
</div>

<div id="bosswrap"><div id="bossnm"></div><div id="bossbar"><div id="bossfill"></div></div></div>
<button id="special">ATIVAR INFLAMASSOMA</button>
<div id="sab"></div>
<div id="coach" aria-live="polite"></div>
<div id="toast"></div>
<div id="ovl"><div class="card" id="card"></div></div>
<div id="share" class="hide"><div class="card" id="sharecard"></div></div>

<script>
'use strict';
/* ============================================================
   IMUNOTROPA — DEFESA CELULAR
   6 fases. Cada fase = UMA célula imune fixa (o jogador não troca),
   com a mecânica efetora própria, contra o patógeno daquela etapa.
   Só toque (arraste o dedo). Canvas 2D, sem dependências.
   ============================================================ */
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
let W=0,H=0,dpr=1;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
const TAU=Math.PI*2;
function hexA(h,a){const n=parseInt(h.slice(1),16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';}

/* ---------- As 6 fases (arco combinado) ---------- */
const PHASES=[
 {nm:'FASE 1 · FAGOCITOSE',        boss:'COLÔNIA BACTERIANA', ac:'#8bd0ff', wall:'#2a0a0e', dk:'#0e0305', vein:'#ff5a4a',
  cellNm:'MACRÓFAGO', mol:'Fagocitose + Inflamassoma', bnm:'COLÔNIA BACTERIANA',
  cell:{k:'mac',speed:0.82,shields:6,fireT:0.34,dmg:2,kind:'engulf',range:1200}, dist:4200, bhp:70},
 {nm:'FASE 2 · NEUTRÓFILOS E NETs',boss:'MASSA FÚNGICA',       ac:'#b98cff', wall:'#2a0810', dk:'#100306', vein:'#ff5c6a',
  cellNm:'NEUTRÓFILO', mol:'ROS + NETs', bnm:'MASSA FÚNGICA',
  cell:{k:'neu',speed:1.16,shields:3,fireT:0.09,dmg:1,kind:'ros',spread:0.16,lifespan:12}, dist:4400, bhp:85},
 {nm:'FASE 3 · RECONHECIMENTO NK', boss:'CÉLULA EVASORA',      ac:'#2ee6c8', wall:'#2a0c08', dk:'#0e0403', vein:'#ff7a3a',
  cellNm:'CÉLULA NK', mol:'Perforina e granzimas · MHC I reduzido', bnm:'CÉLULA EVASORA (MHC I reduzido)',
  cell:{k:'nk',speed:1.0,shields:4,fireT:0.2,dmg:2,kind:'nk',aim:true}, dist:4600, bhp:95},
 {nm:'FASE 4 · CITOTOXICIDADE',    boss:'FÁBRICA VIRAL',       ac:'#ff9a4a', wall:'#300a0a', dk:'#100303', vein:'#e23a2a',
  cellNm:'LINFÓCITO T CD8', mol:'Perforina e granzimas · peptídeo em MHC I', bnm:'FÁBRICA VIRAL',
  cell:{k:'cd8',speed:1.0,shields:4,fireT:0.28,dmg:3,kind:'perf',pierce:2}, dist:4800, bhp:105},
 {nm:'FASE 5 · COORDENAÇÃO Th1',   boss:'GRANULOMA',           ac:'#ffd34a', wall:'#2a1206', dk:'#100602', vein:'#ff7a3a',
  cellNm:'LINFÓCITO T CD4', mol:'IFN-γ · ativa macrófagos', bnm:'BACILO INTRACELULAR',
  cell:{k:'cd4',speed:1.05,shields:4,fireT:0.22,dmg:0,kind:'cyto'}, dist:4600, bhp:120},
 {nm:'FASE 6 · CENTRO GERMINATIVO',boss:'ALVO COM ANTÍGENO',   ac:'#4aa8ff', wall:'#2a0a0e', dk:'#0e0305', vein:'#ff5a4a',
  cellNm:'LINFÓCITO B', mol:'IgG + maturação de afinidade', bnm:'CÉLULA ALVO COM ANTÍGENO',
  cell:{k:'b',speed:1.0,shields:4,fireT:0.2,dmg:1.3,kind:'ab',homing:true}, dist:4400, bhp:150},
];

/* ---------- Dificuldade ---------- */
const DIFFS={

  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); }

  const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter(),t=AC.currentTime;
  s.buffer=noiseBuf; f.type='lowpass'; f.frequency.value=fl||900;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+dur); }

const SEG=36;
function tunnelProfile(d){
  let c=W/2+Math.sin(d*0.004+seedA)*W*0.16+Math.sin(d*0.0011+seedB)*W*0.09;
  let h=W*0.30+Math.sin(d*0.0063+seedC)*W*0.075+Math.sin(d*0.0021)*W*0.04;
  h=clamp(h,W*0.225,W*0.40);
  const cA=W/2,hA=Math.min(W*0.465,W/2-6); c=lerp(c,cA,arena); h=lerp(h,hA,arena);
  c=clamp(c,h+6,W-h-6);
  const rr=1-arena*0.45;
  const rl=(Math.sin(d*0.11+seedD)*7+Math.sin(d*0.27+seedE)*4.5+Math.sin(d*0.061+seedA*2)*5)*rr;
  const rg=(Math.sin(d*0.13+seedE*1.7)*7+Math.sin(d*0.31+seedD*1.3)*4.5+Math.sin(d*0.053+seedB*2)*5)*rr;
  let l=c-h+rl,r=c+h+rg;
  if(r-l<112){const m=(l+r)/2;l=m-56;r=m+56;}
  l=clamp(l,4,W-120); r=clamp(r,l+112,W-4);
  return {l,r};
}

function initSegs(){ segs=[]; const p0=tunnelProfile(dist);

function blobPath(x,y,rx,ry,wob,ph){ const n=14;

    const w=Math.sin(a*3+time*2.2+ph)*wob+Math.sin(a*5-time*1.7+ph*2)*wob*0.55;
    const px=x+Math.cos(a)*(rx+w),py=y+Math.sin(a)*(ry+w);

  ctx.closePath(); }

  for(let i=1;i<pts.length-1;i++){ const xc=(pts[i].x+pts[i+1].x)/2,yc=(pts[i].y+pts[i+1].y)/2; ctx.quadraticCurveTo(pts[i].x,pts[i].y,xc,yc); }

let shakeMotionOn=false,lastMotion=0;
function onMotion(e){ if(!profile.shake||!powerReady()||!(state==='play'||state==='boss')) return;
  const a=e.accelerationIncludingGravity||e.acceleration; if(!a) return;
  const mag=Math.sqrt((a.x||0)**2+(a.y||0)**2+(a.z||0)**2),now=performance.now();
  if(mag>22&&now-lastMotion>1200){ lastMotion=now; castPower(); vibrate(55); } }
async function enableShake(){ if(shakeMotionOn) return true;
  try{ if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
      if(await DeviceMotionEvent.requestPermission()!=='granted') return false; }
    window.addEventListener('devicemotion',onMotion); shakeMotionOn=true; return true;
  }catch(_){ return false; } }

function arcHTML(){

  return h+'</div>';
}
function performanceHTML(){ const attempts=phaseStats.correct+phaseStats.wrongShots+phaseStats.blockedBoss;
  const precision=attempts?Math.round(phaseStats.correct/attempts*100):100;
  const reading=phaseStats.wrongShots===0&&phaseStats.blockedBoss===0&&phaseStats.protectedHits===0?'Você distinguiu os alvos sem causar dano colateral.':'Houve reconhecimento incorreto ou dano ao tecido. Revise os sinais que distinguem o alvo desta fase.';

const INFO_IMUNO =
  '<p class="txt" style="text-align:left">A <b>imunidade inata</b> responde rapidamente a padrões conservados e sinais de dano. A <b>imunidade adaptativa</b> usa reconhecimento clonal, costuma demorar mais na primeira exposição e pode gerar <b>memória</b>. As duas atuam de forma integrada.</p>'+
  '<div class="lz"><span class="lk" style="color:#9fd0ff">MECANISMOS DO JOGO</span>Macrófago, neutrófilo e célula NK representam mecanismos inatos. Linfócitos T CD8, T CD4 e B mostram reconhecimento adaptativo, coordenação e memória.</div>'+
  '<div class="lz"><span class="lk" style="color:#ffd34a">LIMITE DO MODELO</span>As seis fases não são uma sequência obrigatória. No organismo, células, mediadores e tecidos interagem ao mesmo tempo, e a resposta varia conforme o patógeno e o local da infecção.</div>'+
  '<div class="lz"><span class="lk" style="color:#62f0a8">CONVENÇÕES DO JOGO</span>O item verde de recuperação e o aumento do disparo pelos itens azuis existem para equilibrar a partida. Eles não representam terapias nem efeitos moleculares diretos.</div>'+
  '<div class="lz"><span class="lk" style="color:#ff7d91">TOLERÂNCIA E DANO</span>A defesa precisa distinguir ameaça e tecido próprio. Eliminar células sadias reduz a integridade do tecido; deixar patógenos escaparem também causa dano.</div>'+
  '<div class="lz"><span class="lk" style="color:#ff6b4a">INFLAMAÇÃO</span>A inflamação altera vasos e tecidos e favorece o recrutamento celular. No jogo, o edema estreita o espaço de movimento. Respostas intensas também podem causar dano.</div>'+
  '<div class="lz"><span class="lk" style="color:#ffd34a">LIÇÃO CENTRAL</span>Uma boa resposta imune depende de reconhecer o alvo, escolher o mecanismo adequado, coordenar células e limitar o dano colateral.</div>';
const INFO_PHASE_EXTRA=[
  '<p class="txt" style="text-align:left"><b>O que acontece:</b> receptores de reconhecimento detectam padrões microbianos. O macrófago pode fagocitar o alvo e, por outra via, ativar inflamassomas que processam IL-1β.</p><p class="txt" style="text-align:left"><b>Ligação com o jogo:</b> o alcance curto representa a necessidade de contato para englobar o micróbio. O pulso do poder representa inflamação local, não uma arma direta do inflamassoma contra bactérias.</p>',
  '<p class="txt" style="text-align:left"><b>O que acontece:</b> neutrófilos são recrutados rapidamente, produzem espécies reativas de oxigênio e podem formar NETs, redes extracelulares que retêm micróbios.</p><p class="txt" style="text-align:left"><b>Ligação com o jogo:</b> a duração curta e a reposição representam renovação e recrutamento. G-CSF favorece produção e mobilização, enquanto CXCL8 orienta migração. ROS e NETs também podem contribuir para lesão tecidual.</p>',
  '<p class="txt" style="text-align:left"><b>O que acontece:</b> células NK integram receptores ativadores e inibitórios. MHC I preservado pode fornecer sinal inibitório, enquanto sua redução pode favorecer reconhecimento por ausência do próprio.</p><p class="txt" style="text-align:left"><b>Ligação com o jogo:</b> o símbolo ∅ transforma esse balanço complexo em uma regra visual. Na biologia real, MHC I reduzido não é suficiente em todos os contextos. IL-12 e IL-15 favorecem ativação, sobrevivência e citotoxicidade da NK.</p>',
  '<p class="txt" style="text-align:left"><b>O que acontece:</b> o TCR do linfócito T CD8 reconhece um peptídeo específico apresentado por MHC I. Após o reconhecimento correto, perforina e granzimas podem induzir apoptose da célula alvo.</p><p class="txt" style="text-align:left"><b>Ligação com o jogo:</b> MHC I sozinho não basta, pois o peptídeo correto também é necessário. IL-2 apoia expansão de linfócitos ativados e interferons do tipo I sustentam respostas antivirais.</p>',
  '<p class="txt" style="text-align:left"><b>O que acontece:</b> o TCR do linfócito T CD4 reconhece peptídeos apresentados por MHC II. Células Th1 produzem IFN-γ, que aumenta a capacidade microbicida de macrófagos.</p><p class="txt" style="text-align:left"><b>Ligação com o jogo:</b> a apresentação por MHC II foi omitida para concentrar a fase na coordenação entre T CD4 e macrófago. IL-12 e IFN-γ reforçam a diferenciação e a função Th1.</p>',

function showInfo(tab){ state='info'; setAccent('#ff6b4a'); elSpecial.style.display='none';
  const t=tab||'imuno';
  const tabs='<div style="display:flex;gap:8px;margin:2px 0 8px">'+
    '<button class="btn'+(t==='imuno'?'':' ghost')+'" id="tImu" style="margin-top:0;padding:10px;font-size:10px">VISÃO GERAL</button>'+
    '<button class="btn'+(t==='cred'?'':' ghost')+'" id="tCred" style="margin-top:0;padding:10px;font-size:11px">CRÉDITOS</button></div>';
  let phaseTabs='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 10px">';
  for(let i=0;i<6;i++) phaseTabs+='<button class="btn'+(t==='p'+i?'':' ghost')+'" id="tP'+i+'" style="margin:0;padding:8px 3px;font-size:9px">FASE '+(i+1)+'</button>';
  phaseTabs+='</div>';
  const body=t==='cred'?('<h2>Realização e créditos</h2>'+INFO_CRED):t[0]==='p'?infoPhaseHTML(+t.slice(1)):('<h2>A resposta imune</h2>'+INFO_IMUNO);
  showOvl('<div class="eyebrow">SABER MAIS · LIÇÕES POR FASE</div>'+tabs+(t==='cred'?'':phaseTabs)+body+'<button class="btn ghost" id="bkInfo">VOLTAR</button>');
  tap($('tImu'),()=>showInfo('imuno')); tap($('tCred'),()=>showInfo('cred'));
  if(t!=='cred') for(let i=0;i<6;i++) tap($('tP'+i),()=>showInfo('p'+i));
  tap($('bkInfo'),showMenu);
}
function showBrief(full){ const first=!profile.seen[phi],expanded=full||first;
  showOvl('<div class="eyebrow">'+PH.nm+'</div>'+
    '<h2 style="text-shadow:0 0 12px '+PH.ac+'">'+PH.cellNm+'</h2>'+
    (expanded?lessonHTML(phi):'<p class="txt"><b>Alvo:</b> '+TARGET_SHORT[phi]+'<br><b>Poder:</b> '+POWER_NAME[phi]+'<br><b>Mediadores:</b> '+MOLECULAR_BOOST[phi].nm+'</p>')+
    signalGuideHTML()+
    '<p class="note">Arraste o dedo para mover · tiro automático · use o botão no canto inferior esquerdo ou, se ativado nos ajustes, agite o aparelho para usar o poder</p>'+
    '<button class="btn" id="go">COMEÇAR ▶</button>'+
    (!expanded?'<button class="btn ghost" id="review">REVER CONCEITO</button>':'') );
  tap($('go'),beginPlay); if(!expanded) tap($('review'),()=>showBrief(true));
}

let selDiff=profile.difficulty||'medio';
function showSettings(){ state='settings'; setAccent('#ff6b4a');
  showOvl('<div class="eyebrow">AJUSTES</div><h2>Acessibilidade</h2>'+
    '<button class="btn '+(profile.contrast?'':'ghost')+'" id="ct">CONTRASTE AUMENTADO · '+(profile.contrast?'SIM':'NÃO')+'</button>'+
    '<button class="btn '+(profile.vibration?'':'ghost')+'" id="vb">VIBRAÇÃO · '+(profile.vibration?'SIM':'NÃO')+'</button>'+
    '<button class="btn '+(profile.music?'':'ghost')+'" id="mu">MÚSICA CHIPTUNE · '+(profile.music?'SIM':'NÃO')+'</button>'+
    '<button class="btn '+(profile.shake?'':'ghost')+'" id="sk">AGITAR PARA USAR O PODER · '+(profile.shake?'SIM':'NÃO')+'</button>'+
    '<button class="btn '+(profile.lowFx?'':'ghost')+'" id="fx">EFEITOS REDUZIDOS (DESEMPENHO) · '+(profile.lowFx?'SIM':'NÃO')+'</button>'+
    '<p class="note">O botão de poder continua disponível. Em alguns iPhones, o movimento precisa ser autorizado após tocar na opção.</p>'+
    '<button class="btn ghost" id="bkSet">VOLTAR</button>');
  tap($('ct'),()=>{profile.contrast=!profile.contrast;applyPrefs();saveProfile();showSettings();});
  tap($('vb'),()=>{profile.vibration=!profile.vibration;saveProfile();showSettings();});
  tap($('mu'),()=>{profile.music=!profile.music;musicT=0;saveProfile();showSettings();});
  tap($('sk'),async()=>{ profile.shake=!profile.shake; if(profile.shake&&!await enableShake()){profile.shake=false;toast('Movimento não autorizado');} saveProfile();showSettings(); });
  tap($('fx'),()=>{ profile.lowFx=!profile.lowFx; applyPrefs(); saveProfile(); showSettings(); });
  tap($('bkSet'),showMenu);
}
function showLevelSelect(){ state='levels'; setAccent('#ff6b4a'); elSpecial.style.display='none';
  const dnames=['FÁCIL','MÉDIO','DIFÍCIL'], dkeys=['facil','medio','dificil'];
  let chips='<div style="display:flex;gap:6px;margin:2px 0 10px">';
  dkeys.forEach((k,ix)=>{ chips+='<button class="btn'+(selDiff===k?'':' ghost')+'" id="d'+ix+'" style="margin-top:0;padding:8px;font-size:10px">'+dnames[ix]+'</button>'; });
  chips+='</div>';
  let btns='';
  PHASES.forEach((p,i)=>{ const done=profile.completed[i],best=profile.best[i]||0; btns+='<button class="btn'+(i===0?'':' ghost')+'" id="lv'+i+'" style="text-align:left;font-size:11px;letter-spacing:.02em;padding:11px">'+(done?'✓ ':((i+1)+' · '))+p.cellNm+'<br><span style="font-size:8px;color:#9fb4d8;letter-spacing:.04em">'+POWER_NAME[i]+(best?' · MELHOR '+best:'')+'</span></button>'; });
  showOvl('<div class="eyebrow">ESCOLHER FASE</div><h2>Fases</h2>'+
    '<p class="txt" style="margin:8px 0 0">Dificuldade</p>'+chips+btns+
    '<button class="btn ghost" id="bkLvl">VOLTAR</button>');
  dkeys.forEach((k,ix)=> tap($('d'+ix),()=>{ selDiff=k; profile.difficulty=k; saveProfile(); showLevelSelect(); }));
  PHASES.forEach((p,i)=> tap($('lv'+i),()=>{ audioInit(); if(AC&&AC.state==='suspended') AC.resume(); if(profile.shake) enableShake(); DIFF=DIFFS[selDiff]; score=0; tissueHealth=100; startPhase(i); }));
  tap($('bkLvl'),showMenu);
}
function showClear(){ state='clear'; elSpecial.style.display='none';
  const nx=PHASES[phi+1], L=LESSON[phi];
  showOvl('<div class="eyebrow">FASE '+(phi+1)+' CONCLUÍDA</div>'+
    '<h2>CHEFE<br>ELIMINADO</h2>'+
    '<div class="lz"><span class="lk" style="color:#9fd0ff">VOCÊ APRENDEU</span>'+L.concept+'</div>'+
    performanceHTML()+
    '<p class="txt">Próxima célula: <span class="big">'+nx.cellNm+'</span><br>'+nx.mol+'</p>'+
    '<div class="stat">PONTOS <span>'+score+'</span></div>'+
    '<button class="btn" id="nx">FASE '+(phi+2)+' ▸</button>');
  tap($('nx'),()=>startPhase(phi+1));
}
function showWin(){ state='win'; elSpecial.style.display='none';
  showOvl('<div class="eyebrow">SEIS FASES CONCLUÍDAS</div>'+
    '<h1>RESPOSTA<br>COORDENADA</h1>'+
    '<p class="txt">Você concluiu seis mecanismos da resposta imune, do reconhecimento inato à seleção de linfócitos B. No centro germinativo, células B selecionadas podem originar <b>plasmócitos</b>, que secretam anticorpos, e <b>células B de memória</b>.</p>'+
    '<div class="lz"><span class="lk" style="color:#9fd0ff">MODELO EDUCACIONAL</span>Essas fases não formam uma sequência obrigatória. No organismo, as respostas se sobrepõem, interagem e variam conforme a ameaça e o tecido.</div>'+
    performanceHTML()+
    arcHTML()+
    (newRecord?'<div class="badge">★ NOVO RECORDE ★</div>':'')+
    '<div class="stat">PONTUAÇÃO FINAL <span>'+score+'</span></div>'+
    (hiScore>0?'<p class="note" style="margin-top:4px">RECORDE: '+hiScore+'</p>':'')+
    '<button class="btn share" id="sh">COMPARTILHAR · DESAFIAR</button>'+
    '<button class="btn" id="ag">JOGAR NOVAMENTE</button>'+
    '<button class="btn ghost" id="more2">SABER MAIS · imunologia & créditos</button>');

      const AC1='#ff6b4a', AC2='#4aa8ff';

      x.fillStyle=bg; x.fillRect(0,0,w,h);
      for(let i=0;i<80;i++){ x.globalAlpha=0.05+Math.random()*0.12; x.fillStyle=Math.random()<.5?AC1:AC2;
        x.beginPath(); x.arc(Math.random()*w,Math.random()*h,Math.random()*3+1,0,Math.PI*2); x.fill(); }
      x.globalAlpha=1;

      x.beginPath(); x.arc(cx,cy,360,0,Math.PI*2); x.stroke();
      for(let i=0;i<10;i++){ const a=i/10*Math.PI*2; x.fillStyle=i%2?AC1:AC2; x.shadowColor=x.fillStyle; x.shadowBlur=24;
        x.beginPath(); x.arc(cx+Math.cos(a)*360,cy+Math.sin(a)*360,9,0,Math.PI*2); x.fill(); }
      x.shadowBlur=0;
      const F=(s,wt)=> (wt||900)+' '+s+"px Orbitron, 'Segoe UI', sans-serif";
      x.textAlign='center'; x.textBaseline='middle';
      x.fillStyle='#9fb4d8'; x.font=F(30,700); x.fillText('IMUNOTROPA · DEFESA CELULAR', cx, 210);
      x.fillStyle='#ffffff'; x.font=F(230); x.shadowColor=AC1; x.shadowBlur=50; x.fillText(String(value), cx, cy-10); x.shadowBlur=0;
      x.fillStyle=AC1; x.font=F(46); x.fillText(label||'PONTOS', cx, cy+150);
      x.fillStyle='#eaf6ff'; x.font=F(58); x.fillText('CONSEGUE SUPERAR?', cx, 1000);
      x.fillStyle='#b9c8e4'; x.font=F(30,700); x.fillText('Seis mecanismos · cada célula, uma função', cx, 1070);
      x.fillStyle='#7b8aa8'; x.font=F(26,700); x.fillText('csbiology.org', cx, 1270);
      if(c.toBlob){ c.toBlob(b=>res(b),'image/png'); }
      else { try{ const d=c.toDataURL('image/png'), bin=atob(d.split(',')[1]), arr=new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); res(new Blob([arr],{type:'image/png'})); }catch(_){ res(null); } }
    }catch(_){ res(null); }
  });
}

/* ---------- Tiro do jogador (por célula) ---------- */
function fire(){
  if(pb.length>240) return;
  const mol=molecularBoost>0,dm=CELL.dmg*DIFF.dmgMul*(mol?1.65:1), boost=powerMode>0;
  if(CELL.kind==='engulf'){                 // MACRÓFAGO: engolfa (poder = piroptose instantânea)
    const offs=mol?[-7,7]:[0]; for(const off of offs) pb.push({x:P.x+off,y:P.y-14,vx:off*1.5,vy:-500,dmg:dm,kind:'engulf',range:Math.max(CELL.range,H+80),size:mol?10:7});
  } else if(CELL.kind==='ros'){             // NEUTRÓFILO: rajada de ROS (poder = rede de NETs)
    const shots=mol?[-.18,0,.18]:[rnd(-CELL.spread,CELL.spread)];
    for(const off of shots){ const a=-Math.PI/2+off; pb.push({x:P.x,y:P.y-14,vx:Math.cos(a)*720,vy:Math.sin(a)*720,dmg:dm,kind:'ros',size:mol?3.5:2.6}); }
  } else if(CELL.kind==='nk'){              // NK: auto-mira | RAJADA: perfura vários missing-self
    let tx=P.x,ty=-40,best=1e9;
    for(const e of en){ if(e.k==='inf'&&e.mhc===false&&e.y<P.y){ const d=dist2(P.x,P.y,e.x,e.y); if(d<best){best=d;tx=e.x;ty=e.y;} } }
    if(bossHittable()){ const d=dist2(P.x,P.y,boss.x,boss.y)*0.4; if(d<best){tx=boss.x;ty=boss.y;} }
    const a=Math.atan2(ty-P.y,tx-P.x);
    if(boost) pb.push({x:P.x,y:P.y-14,vx:Math.cos(a)*780,vy:Math.sin(a)*780,dmg:dm+1,kind:'nk',pierce:3});
    else pb.push({x:P.x,y:P.y-14,vx:Math.cos(a)*(mol?720:560),vy:Math.sin(a)*(mol?720:560),dmg:dm,kind:'nk',pierce:mol?2:0});
  } else if(CELL.kind==='perf'){            // CD8: 1 bolt | SURTO LÍTICO: 3 jatos de granzima
    if(boost){ for(const off of[-15,0,15]) pb.push({x:P.x+off,y:P.y-16,vx:0,vy:-860,dmg:dm,kind:'perf',pierce:CELL.pierce}); }
    else { for(const off of(mol?[-9,9]:[0])) pb.push({x:P.x+off,y:P.y-16,vx:0,vy:-820,dmg:dm,kind:'perf',pierce:CELL.pierce+(mol?1:0)}); }
  } else if(CELL.kind==='cyto'){            // CD4: IFN-γ (não mata; ativa aliados). Poder = pulso de ativação
    for(const off of(mol?[-12,0,12]:[0])) pb.push({x:P.x+off,y:P.y-14,vx:0,vy:-560,dmg:0,kind:'cyto',aura:mol?34:18});
  } else if(CELL.kind==='ab'){              // B: teleguiado | DESCARGA: rajada de 3 teleguiados
    const matur=gc?gc.matur:0.5, d=dm*(0.6+0.9*matur);
    const speed=440+140*matur,turn=2.2+6.5*matur;
    if(boost||mol){ for(let s=-1;s<=1;s++){ const a=-Math.PI/2+s*(0.42-0.20*matur); pb.push({x:P.x,y:P.y-14,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,dmg:d,kind:'ab',homing:true,turn}); } }
    else pb.push({x:P.x,y:P.y-14,vx:rnd(-65,65)*(1-matur),vy:-speed,dmg:d,kind:'ab',homing:true,turn});
  }
  sCellShot(CELL.kind);
}
function allyFire(a){                        // macrófago ativado (fase 5): mira o bacilo mais próximo
  let tx=a.x,ty=-40,best=1e9,has=false;
  for(const e of en){ if(e.k==='byst') continue; if(e.y<a.y+40){ const d=dist2(a.x,a.y,e.x,e.y); if(d<best){best=d;tx=e.x;ty=e.y;has=true;} } }
  if(boss&&boss.entered&&!boss.dying){ const d=dist2(a.x,a.y,boss.x,boss.y); if(d<best){tx=boss.x;ty=boss.y;has=true;} }
  if(!has){ a.aimx=null; return; }            // sem alvo válido: não desperdiça tiro no próprio tecido
  a.aimx=tx; a.aimy=ty;                        // guarda o alvo para desenhar a linha de mira
  const ang=Math.atan2(ty-a.y,tx-a.x);
  pb.push({x:a.x,y:a.y,vx:Math.cos(ang)*520,vy:Math.sin(ang)*520,dmg:2,kind:'allyshot'});
}

/* ---------- Movimento ---------- */
function movePlayer(dt){
  const MAXV=580; let tv=0,tvy=0;
  if(touchOn){ tv=clamp((touchX-P.x)*11,-MAXV,MAXV); tvy=clamp((touchY-P.y)*11,-MAXV,MAXV); }
  else { if(keys.ArrowLeft) tv=-MAXV*.85; else if(keys.ArrowRight) tv=MAXV*.85; if(keys.ArrowUp) tvy=-MAXV*.72; else if(keys.ArrowDown) tvy=MAXV*.72; }
  P.vx=lerp(P.vx,tv,Math.min(1,dt*12)); P.vy=lerp(P.vy,tvy,Math.min(1,dt*12));
  P.x+=P.vx*dt*CELL.speed; P.y+=P.vy*dt*CELL.speed; P.x=clamp(P.x,16,W-16); P.y=clamp(P.y,yTop(),yBot());
  const w=wallAt(P.y);
  if(P.x-P.r<w.l){ if(P.inv<=0) hurt(1); P.x=w.l+P.r+4; P.vx=Math.abs(P.vx)*0.4+120; }
  if(P.x+P.r>w.r){ if(P.inv<=0) hurt(1); P.x=w.r-P.r-4; P.vx=-Math.abs(P.vx)*0.4-120; }
  if(P.inv>0) P.inv-=dt;
  P.fireT-=dt; if(P.fireT<=0&&!P.dead){ P.fireT=CELL.fireT*DIFF.pFireMul*(powerMode>0?0.6:1); fire(); }
}

/* ---------- Update ---------- */
function nearestEnemy(x,y){ let best=1e9,tgt=null;
  for(const e of en){ if(!playerEffective(e)) continue; const d=dist2(x,y,e.x,e.y); if(d<best){best=d;tgt=e;} }
  if(boss&&boss.entered&&boss.dying<=0){ const d=dist2(x,y,boss.x,boss.y); if(d<best){best=d;tgt=boss;} }
  if(!tgt) return {x,y:-100}; return tgt; }
function spawnResponder(){ const y=-24,w=wallAt(y); responders.push({x:rnd(w.l+18,w.r-18),y,vx:rnd(-14,14),vy:rnd(80,115),r:rnd(5,8),ph:rnd(0,TAU)}); }
function update(dt){
  time+=dt; stT+=dt;
  if(shake>0) shake=Math.max(0,shake-dt*26);
  if(flash>0) flash-=dt;
  const inLevel=state==='play'||state==='bossintro'||state==='boss';
  if(!inLevel) return;
  updateMusic(dt);
  ambienceT-=dt; if(ambienceT<=0){ ambienceT=rnd(3.2,4.6); ambientPulse(); }
  powerStress=Math.max(0,powerStress-dt*.035); inflamEventT-=dt;
  if(inflamEventT<=0&&inflamEventLeft<=0){ inflamEventLeft=rnd(8,12); inflamEventT=rnd(24,34); addNote(W/2,H*.25,'INFLAMAÇÃO · EDEMA E RECRUTAMENTO','#ff6b4a',2.2); sAlarm(); }
  if(inflamEventLeft>0) inflamEventLeft-=dt;
  inflammationTarget=Math.max(powerStress,inflamEventLeft>0?.82:0); inflammation=lerp(inflammation,inflammationTarget,Math.min(1,dt*(inflammationTarget>inflammation?1.5:.55)));
  if(inflammation>.35){ responderT-=dt; if(responderT<=0&&responders.length<20){ responderT=rnd(.45,.9); spawnResponder(); } }
  if(tutorialActive){ tutorialT+=dt; updateTutorial(); }
  if(combo>0){ comboT-=dt; if(comboT<=0) combo=0; }   // combo decai em silêncio se você parar de acertar

  const SPD=120;
  for(const s of segs) s.y+=SPD*dt; dist+=SPD*dt;
  while(segs[0].y>-SEG) pushTop(); while(segs[segs.length-1].y>H+SEG*2) segs.pop();

  if(state==='play'){
    levelElapsed+=dt;
    if(levelElapsed>=DIFF.duration){ state='bossintro'; stT=0; sAlarm(); }
    else if(levelElapsed<DIFF.duration-8){
      spT-=dt; if(spT<=0){ spT=rnd(1.6,2.6)*DIFF.spawnMul; spawnFor(); }
    }
    if(CELL.k==='cd4'){ spAlly-=dt; if(spAlly<=0&&allies.length<6){ spAlly=3.5; spawnAlly(); } }
  }
  if(state==='bossintro'){ arena=Math.min(1,arena+dt/1.3); if(stT>1.7){ state='boss'; boss=makeBoss(); elBossN.textContent='⚠ '+PH.bnm+' ⚠'; placeBossBar(true); } }
  if(state==='boss'){ arena=Math.min(1,arena+dt); if(boss) bossUpdate(dt); }

  // BOTÃO DE PODER ATIVO — vale para todas as fases
  if(netCd>0) netCd-=dt;
  if(molecularBoost>0){ molecularBoost=Math.max(0,molecularBoost-dt); }
  if(powerMode>0){ const was=powerMode; powerMode-=dt; if(powerMode<=0){ powerMode=0; addNote(P.x,P.y-26,'modo encerrado',PH.ac,0.9); } }
  { const inPlay=(state==='play'||state==='boss'), rdy=powerReady()&&inPlay;
    elSpecial.style.display=inPlay?'block':'none';   // fica no dock; o fade cuida da entrada
    elSpecial.classList.toggle('rdy',rdy);
    if(rdy){ elSpecial.textContent=POWER_NAME[phi];
      if(!powerHinted){ powerHinted=true; addNote(W*0.35,H*0.70,'PODER PRONTO ✦ botão embaixo à esquerda',PH.ac,2.1); sPow(); } } }
  if(CELL.k==='neu' && !P.dead){ life-=dt/CELL.lifespan; if(life<=0) netosis(); }
  if(gc){ if(gc.hp>0){ gc.matur=Math.min(1,gc.matur+dt/16);
      const level=gc.matur>=1?3:gc.matur>=0.7?2:gc.matur>=0.35?1:0;
      if(level>affinityMilestone){ affinityMilestone=level; addNote(gc.x,gc.y+gc.r+18,level===3?'ALTA AFINIDADE':'AFINIDADE AUMENTOU','#bfe0ff',1.5); sPow(); } }
    if(gc.hitT>0) gc.hitT-=dt;
    const wc=wallAt(gc.y); gc.x=lerp(gc.x,(wc.l+wc.r)/2,Math.min(1,dt*2));   // mantém o CG dentro do lúmen
    if(gcWarnT>0) gcWarnT-=dt;
    if(gc.hp>0&&gc.hp<40&&gcWarnT<=0){ gcWarnT=2.4; addNote(gc.x,gc.y-gc.r-14,'⚠ PROTEJA O CENTRO GERMINATIVO',PH.ac,1.6); sAlarm(); }
    if(gc.hp<=0 && !P.dead){ P.dead=true; P.deadT=0; sBig(); shake=16; burst(gc.x,gc.y,50,'#4aa8ff',300,1); } }

  if(P.dead){ P.deadT+=dt; if(P.deadT>1.3&&!phaseEnded){ phaseEnded=true; showOver(); } }
  else movePlayer(dt);

  // mediadores moleculares coletáveis que mudam temporariamente o padrão do tiro
  for(let i=pu.length-1;i>=0;i--){ const u=pu[i]; u.y+=u.vy*dt; u.t-=dt;
    const uw=wallAt(u.y); u.x=clamp(u.x,uw.l+22,uw.r-22);
    if(u.t<=0||u.y>H+30){ pu.splice(i,1); continue; }
    if(!P.dead&&dist2(P.x,P.y,u.x,u.y)<34*34){
      if(u.kind==='heal'){ const before=P.shield; P.shield=Math.min(P.maxShield,P.shield+2); phaseStats.healsCollected++; pips();
        pu.splice(i,1); sPow(); vibrate(30); addNote(P.x,P.y-30,'VIDA RECUPERADA +'+(P.shield-before),'#62f0a8',1.7);
      }else{ molecularBoost=molecularBoostMax; pu.splice(i,1); sMolecular(); vibrate(30);
        addNote(P.x,P.y-30,MOLECULAR_BOOST[phi].nm, '#66f0ff',1.7); addNote(P.x,P.y-46,MOLECULAR_BOOST[phi].desc,'#d9fbff',1.7); }
    } }
  for(let i=responders.length-1;i>=0;i--){ const r=responders[i]; r.x+=r.vx*dt; r.y+=r.vy*dt; const rw=wallAt(r.y); r.x=clamp(r.x,rw.l+r.r,rw.r-r.r); if(r.y>H+24) responders.splice(i,1); }

  // aliados (fase 5) — presos DENTRO do vaso (lúmen), sem escapar pro tecido
  for(const a of allies){
    a.x+=a.vx*dt; a.y+=a.vy*dt;
    if(a.y<H*0.33){ a.y=H*0.33; a.vy=Math.abs(a.vy); }
    if(a.y>H*0.62){ a.y=H*0.62; a.vy=-Math.abs(a.vy); }
    const w=wallAt(a.y);
    if(a.x<w.l+a.r+6){ a.x=w.l+a.r+6; a.vx=Math.abs(a.vx); }
    if(a.x>w.r-a.r-6){ a.x=w.r-a.r-6; a.vx=-Math.abs(a.vx); }
    if(a.act>0){ a.act-=dt; a.fireT-=dt; if(a.fireT<=0){ a.fireT=0.4; allyFire(a); } }
  }

  // projéteis do jogador / aliados
  for(let i=pb.length-1;i>=0;i--){
    const b=pb[i];
    if(b.homing){ const tgt=nearestEnemy(b.x,b.y); const a=Math.atan2(tgt.y-b.y,tgt.x-b.x),sp=Math.hypot(b.vx,b.vy),turn=b.turn||4.5;
      b.vx=lerp(b.vx,Math.cos(a)*sp,Math.min(1,dt*turn)); b.vy=lerp(b.vy,Math.sin(a)*sp,Math.min(1,dt*turn)); }
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.kind==='engulf'){ b.range-=Math.abs(b.vy)*dt; if(b.range<=0){ burst(b.x,b.y,3,PH.ac,60,.3); pb.splice(i,1); continue; } }
    if(b.y<-24||b.y>H+24||b.x<-24||b.x>W+24){ pb.splice(i,1); continue; }
    const w=wallAt(b.y); if(b.x<w.l||b.x>w.r){ pb.splice(i,1); continue; }

    // CD4: IFN-γ ativa aliados; não fere inimigos
    if(b.kind==='cyto'){ let used=false;
      for(const a of allies){ const aura=b.aura||18; if(dist2(b.x,b.y,a.x,a.y)<(a.r+aura)*(a.r+aura)){ a.act=molecularBoost>0?12:9; burst(a.x,a.y,8,'#ffd34a',120,.5); shock(a.x,a.y,34,'#ffd34a'); addNote(a.x,a.y-18,'ativado (IFN-γ)','#ffd34a',0.7); used=true; break; } }
      if(used) pb.splice(i,1);
      continue;
    }

    // chefe
    if(boss && bossHitAt(b.x,b.y)){
      const canHurtBoss = (b.kind==='allyshot') ? true : bossPlayerCanHurt(b);
      if(canHurtBoss && bossHittable()){ boss.hp-=b.dmg; burst(b.x,b.y,4,'#fff',120,.3); sEHit(); if(boss.hp<=0&&!boss.dying) boss.dying=0.001; }
      else { if(phi===2||phi===3){ phaseStats.blockedBoss++; breakCombo(); } burst(b.x,b.y,2,'#5a6b8c',60,.25); dudNote(boss.x,boss.y-30, phi===4?'CD4 não mata — ative macrófagos':'não é alvo agora'); }
      pb.splice(i,1); continue;
    }

    // inimigos
    let done=false;
    for(let j=en.length-1;j>=0;j--){ const e=en[j];
      if(dist2(b.x,b.y,e.x,e.y)<(e.r+5)*(e.r+5)){
        const eff = (b.kind==='allyshot') ? (e.k!=='byst') : playerEffective(e);
        if(eff){ e.hp-=b.dmg; burst(b.x,b.y,3,'#fff',120,.28);
          if(e.hp<=0) killEnemy(e,j, b.kind==='engulf'?'engulf':''); else sEHit(); }
        else { phaseStats.wrongShots++; breakCombo();
          if(e.tissueHp==null){ e.tissueHp=bystanderHP(); e.maxTissueHp=e.tissueHp; } e.tissueHp-=Math.max(1,b.dmg||1); burst(b.x,b.y,3,'#ffb0be',70,.25);
          const msg=e.k==='byst'?'DANO COLATERAL · CÉLULA DO TECIDO':(phi===2?'MHC I preservado · dano ao próprio tecido':(phi===3?'peptídeo incorreto · dano ao tecido':'DANO COLATERAL'));
          dudNote(e.x,e.y-6,'evite o próprio tecido');
          if(e.tissueHp<=0){ phaseStats.protectedHits++; burst(e.x,e.y,14,'#ff8a9e',140,.65); en.splice(j,1); damageTissue(20,msg); } }
        if((b.kind==='perf'||b.kind==='nk')&&b.pierce>0&&eff){ b.pierce--; } else done=true;
        break;
      }
    }
    if(done) pb.splice(i,1);
  }

  // inimigos: movimento + ataques + colisões
  for(let i=en.length-1;i>=0;i--){ const e=en[i];
    const w=wallAt(e.y);
    if(e.k==='coco'||e.k==='bacilo'){ e.x+=e.vx*dt; e.y+=e.vy*dt;
      if(e.x-e.r<w.l+4){ e.x=w.l+4+e.r; e.vx=Math.abs(e.vx); } if(e.x+e.r>w.r-4){ e.x=w.r-4-e.r; e.vx=-Math.abs(e.vx); }
      if(e.ft!=null){ e.ft-=dt; if(e.ft<=0&&e.y<H*0.72){ e.ft=rnd(2,3)*DIFF.ebRate; eShot(e.x,e.y,aimAng(e.x,e.y),150); } } }
    else if(e.k==='esporo'){ e.x+=e.vx*dt+Math.sin(time*2+e.ph)*20*dt; e.y+=e.vy*dt; }
    else if(e.k==='inf'||e.k==='intra'||e.k==='tum'||e.k==='byst'){ e.x+=e.vx*dt; e.y+=e.vy*dt;
      if(e.x-e.r<w.l){ e.x=w.l+e.r; e.vx=Math.abs(e.vx); } if(e.x+e.r>w.r){ e.x=w.r-e.r; e.vx=-Math.abs(e.vx); }
      // fase 6: tumor busca o CG
      if(e.k==='tum'&&gc&&gc.hp>0){ const a=Math.atan2(gc.y-e.y,gc.x-e.x); e.x+=Math.cos(a)*30*dt; e.y+=Math.sin(a)*10*dt;
        if(dist2(e.x,e.y,gc.x,gc.y)<(gc.r+e.r)*(gc.r+e.r)){ if(gc.hitT<=0){ gc.hp-=8; gc.hitT=0.5; burst(gc.x,gc.y,8,'#ff5c7a',150,.5);} } }
      if(e.ft!=null){ e.ft-=dt; if(e.ft<=0&&e.y<H*0.72){ e.ft=rnd(2.2,3.2)*DIFF.ebRate; eShot(e.x,e.y,aimAng(e.x,e.y),160); } } }
    if(e.y>H+50){
      if(e.k!=='byst' && (playerEffective(e)||(phi===4&&e.k==='intra'))) tissueLeak(4);   // alvo que deveria ter sido contido
      en.splice(i,1); continue; }
    if(e.k!=='byst'&&!P.dead&&P.inv<=0&&dist2(P.x,P.y,e.x,e.y)<(e.r+P.r)*(e.r+P.r)){ hurt(1,'CONTATO COM O PATÓGENO · VIDA -1');
      if(e.k==='coco'||e.k==='bacilo'||e.k==='esporo'){ burst(e.x,e.y,8,'#c6ff62',160,.5); en.splice(i,1); } }
  }

  // projéteis inimigos
  for(let i=eb.length-1;i>=0;i--){ const b=eb[i]; b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.y>H+16||b.y<-16||b.x<-16||b.x>W+16){ eb.splice(i,1); continue; }
    const w=wallAt(b.y); if(b.x<w.l||b.x>w.r){ eb.splice(i,1); continue; }
    if(gc&&gc.hp>0&&dist2(b.x,b.y,gc.x,gc.y)<(gc.r+5)*(gc.r+5)){ if(gc.hitT<=0){ gc.hp-=3; gc.hitT=0.25; } eb.splice(i,1); continue; }
    if(!P.dead&&P.inv<=0&&dist2(P.x,P.y,b.x,b.y)<(P.r+5)*(P.r+5)){ hurt(1,'BOLINHA VERMELHA · VIDA -1'); eb.splice(i,1); } }

  if(!P.dead&&P.inv<=0&&boss&&bossContact()) hurt(1,'CONTATO COM O CHEFE · VIDA -1');

  // redes de NETs: dano local contínuo em quem está preso; ondas de choque decaem
  for(let i=nets.length-1;i>=0;i--){ const nf=nets[i]; nf.t-=dt; if(nf.t<=0){ nets.splice(i,1); continue; }
    for(let j=en.length-1;j>=0;j--){ const e=en[j]; if(dist2(nf.x,nf.y,e.x,e.y)<(nf.r+e.r)*(nf.r+e.r)){ if(playerEffective(e)){ e.hp-=dt*7*DIFF.dmgMul; if(e.hp<=0) killEnemy(e,j,'net'); } } } }
  for(let i=shocks.length-1;i>=0;i--){ shocks[i].t-=dt; if(shocks[i].t<=0) shocks.splice(i,1); }

  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.t-=dt;
    if(p.t<=0){ parts.splice(i,1); continue; } p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.985; p.vy*=0.985; }
  for(let i=notes.length-1;i>=0;i--){ const n=notes[i]; n.t-=dt; n.y-=18*dt; if(n.t<=0) notes.splice(i,1); }
}
/* efetividade da célula do jogador vs inimigo/chefe */
function playerEffective(e){
  if(e.k==='byst') return false;
  if(phi===0||phi===1) return e.k==='coco'||e.k==='bacilo'||e.k==='esporo';
  if(phi===2) return e.k==='inf' && e.mhc===false;   // NK: missing self
  if(phi===3) return e.k==='inf' && e.mhc===true && e.pept===true; // CD8: MHC+peptídeo correto
  if(phi===4) return false;                          // CD4 não mata
  return e.k==='tum';                                // B: anticorpo reconhece Ag da fase
}
function bossPlayerCanHurt(b){
  if(phi===4) return false;                          // CD4 não fere o chefe (só aliados)
  return true;
}

function drawWalls(){
  if(segs.length<2) return;
  const breathe=s=>Math.sin(time*1.7+s.d*0.02)*3.4+Math.sin(time*0.9+s.d*0.05)*1.8+Math.sin(time*0.5)*1.5;
  const ptsL=[],ptsR=[],refL=[],refR=[];
  for(let i=segs.length-1;i>=0;i--){ const s=segs[i],br=breathe(s),n=Math.min(W*.075*inflammation,Math.max(0,(s.r-s.l-112)/2));
    ptsL.push({x:s.l+s.j+br+n,y:s.y}); refL.push(s); ptsR.push({x:s.r+s.k-br-n,y:s.y}); refR.push(s); }
  ctx.fillStyle=inflammation>.05?hexA('#5a0b12',.72):PH.wall;

    for(let i=0;i<pts.length;i++){ const s=ref[i]; const in1=15+Math.sin(s.d*0.05+seedB)*7+Math.sin(time*1.2+s.d*0.03)*2.5; vpts.push({x:pts[i].x-side*in1,y:pts[i].y}); }

function drawResponders(){ for(const r of responders){ ctx.save(); ctx.translate(r.x,r.y); ctx.globalAlpha=.35+.45*inflammation;
    ctx.fillStyle=hexA(PH.ac,.55); ctx.strokeStyle='#eaf6ff'; ctx.lineWidth=1; blobPath(0,0,r.r,r.r,1.1,r.ph); ctx.fill(); ctx.stroke();
    ctx.fillStyle='rgba(15,28,48,.8)'; ctx.beginPath(); ctx.arc(-1,1,r.r*.45,0,TAU); ctx.fill(); ctx.restore(); } }
function drawEnemies(){
  for(const e of en){ ctx.save(); ctx.translate(e.x,e.y);
    if(e.k==='coco'){ ctx.fillStyle='rgba(125,255,74,.5)'; ctx.strokeStyle='#7dff4a'; ctx.lineWidth=1.6; blobPath(0,0,e.r,e.r,1.8,e.ph); ctx.fill(); ctx.stroke();
      ctx.strokeStyle='rgba(125,255,74,.6)'; ctx.lineWidth=1.1; const sw=Math.sin(time*7+e.ph)*4; ctx.beginPath(); ctx.moveTo(0,e.r*0.9); ctx.quadraticCurveTo(sw,e.r+6,sw*1.6,e.r+13); ctx.stroke(); }
    else if(e.k==='bacilo'){ ctx.rotate(Math.sin(time*3+e.ph)*0.3); ctx.fillStyle='rgba(157,255,90,.5)'; ctx.strokeStyle='#9dff5a'; ctx.lineWidth=1.5; blobPath(0,0,e.r*0.7,e.r*1.3,1.4,e.ph); ctx.fill(); ctx.stroke(); }
    else if(e.k==='esporo'){ ctx.fillStyle='rgba(198,255,98,.4)'; ctx.strokeStyle='#c6ff62'; ctx.lineWidth=1.4; blobPath(0,0,e.r,e.r,e.r*0.3,e.ph); ctx.fill(); ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.5)'; for(let k=0;k<4;k++){ const a=e.ph+k*1.6; ctx.beginPath(); ctx.arc(Math.cos(a)*e.r*0.4,Math.sin(a)*e.r*0.4,1.6,0,TAU); ctx.fill(); } }
    else if(e.k==='inf'){                         // célula infectada + bandeira MHC (ou não)
      const target = phi===2 ? (e.mhc===false) : (e.mhc===true&&e.pept===true);
      const bcol = target?'#ff5c7a':'#6fd0a0';
      ctx.fillStyle='rgba(30,16,10,.85)'; ctx.strokeStyle=bcol; ctx.lineWidth=1.8; blobPath(0,0,e.r,e.r,2.4,e.ph); ctx.fill(); ctx.stroke();
      ctx.fillStyle=hexA('#ff5cf0',.5); for(let k=0;k<4;k++){ const a=e.ph+k*1.7+time*0.6; ctx.beginPath(); ctx.arc(Math.cos(a)*e.r*0.5,Math.sin(a)*e.r*0.5,2,0,TAU); ctx.fill(); }
      if(e.mhc){ ctx.strokeStyle='#ffe1a8'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(0,-e.r); ctx.lineTo(0,-e.r-11); ctx.stroke();
        ctx.fillStyle='#ffd34a'; ctx.beginPath(); ctx.moveTo(0,-e.r-11); ctx.lineTo(11,-e.r-8); ctx.lineTo(0,-e.r-5); ctx.closePath(); ctx.fill();
        ctx.fillStyle='#2a1400'; ctx.font='900 6px Orbitron,monospace'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(e.pept?'pMHC':'MHC',6,-e.r-8);
      } else { ctx.fillStyle='rgba(255,120,140,.7)'; ctx.font='900 9px Orbitron,monospace'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('∅',0,-e.r-10); }
      if(target){ const rp=e.r+7+Math.sin(time*5+e.ph)*2; ctx.strokeStyle=hexA('#ff5c7a',.92); ctx.lineWidth=1.9;
        ctx.beginPath(); ctx.arc(0,0,rp,0,TAU); ctx.stroke();
        for(let q=0;q<4;q++){ const a=q*Math.PI/2+time*0.8; ctx.beginPath(); ctx.moveTo(Math.cos(a)*(rp-2),Math.sin(a)*(rp-2)); ctx.lineTo(Math.cos(a)*(rp+6),Math.sin(a)*(rp+6)); ctx.stroke(); } } }
    else if(e.k==='intra'){                       // bactéria intracelular (dentro de célula hospedeira)
      ctx.fillStyle='rgba(30,26,6,.85)'; ctx.strokeStyle='#c9b24a'; ctx.lineWidth=1.6; blobPath(0,0,e.r,e.r,2.2,e.ph); ctx.fill(); ctx.stroke();
      ctx.strokeStyle='#ffd34a'; ctx.lineWidth=1.4; for(let k=0;k<3;k++){ const a=e.ph+k*2+time*0.5; ctx.save(); ctx.rotate(a); ctx.beginPath(); ctx.ellipse(e.r*0.4,0,3.5,1.6,0,0,TAU); ctx.stroke(); ctx.restore(); } }
    else if(e.k==='byst'){                         // célula saudável do tecido, não deve ser atingida
      ctx.fillStyle='rgba(120,170,205,.22)'; ctx.strokeStyle='#bfe0ff'; ctx.lineWidth=1.5; blobPath(0,0,e.r,e.r,1.5,e.ph); ctx.fill(); ctx.stroke();
      ctx.fillStyle='rgba(20,45,75,.85)'; ctx.beginPath(); ctx.arc(-1,1,e.r*.52,0,TAU); ctx.fill();
      ctx.strokeStyle='rgba(191,224,255,.7)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(0,0,e.r+4,0,TAU); ctx.stroke(); }
    else if(e.k==='tum'){                          // célula alvo que exibe o antígeno da fase
      ctx.fillStyle='rgba(40,14,44,.7)'; ctx.strokeStyle='#ff5cf0'; ctx.lineWidth=1.8; blobPath(0,0,e.r,e.r,e.r*0.35,e.ph); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#ff9ef0'; ctx.beginPath(); ctx.arc(0,0,e.r*0.4,0,TAU); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='900 6px Orbitron,monospace'; ctx.textAlign='center'; ctx.fillText('Ag',0,2); }
    let label='MICRORGANISMO';
    if(e.k==='coco') label='BACTÉRIA COCO'; else if(e.k==='bacilo') label='BACTÉRIA BACILO'; else if(e.k==='esporo') label='ESPORO FÚNGICO'; else if(e.k==='byst') label='CÉLULA DO TECIDO';
    else if(e.k==='intra') label='CÉLULA COM BACILO'; else if(e.k==='tum') label='CÉLULA Ag+';
    else if(e.k==='inf'&&phi===2) label=e.mhc?'CÉLULA MHC I+':'INFECTADA · MHC I BAIXO';
    else if(e.k==='inf'&&phi===3) label=e.pept?'INFECTADA · pMHC':'CÉLULA · MHC I';
    ctx.fillStyle=playerEffective(e)||(phi===4&&e.k==='intra')?'#fff':'#bfe0ff'; ctx.font='900 6px Orbitron,monospace'; ctx.textAlign='center'; ctx.fillText(label,0,e.r+16);
    if(e.tissueHp!=null&&e.tissueHp<e.maxTissueHp){ const bw=28,pct=clamp(e.tissueHp/e.maxTissueHp,0,1); ctx.fillStyle='rgba(20,25,38,.85)'; ctx.fillRect(-bw/2,e.r+20,bw,3); ctx.fillStyle=pct>.5?'#c8dcec':'#e0a8d0'; ctx.fillRect(-bw/2,e.r+20,bw*pct,3); }
    ctx.restore(); }
}
function drawBoss(){
  const b=boss; if(!b) return; ctx.save(); const dyA=b.dying>0?Math.max(0,1-b.dying/1.6):1; ctx.globalAlpha=dyA; ctx.translate(b.x,b.y);
  const target = (phi===2||phi===3) ? (b.mode==='target') : true;
  const ac = (phi===2||phi===3) ? (target?PH.ac:'#6fd0a0') : PH.ac;
  ctx.fillStyle=hexA(ac,.12); blobPath(0,0,46,46,6,2.6); ctx.fill();
  ctx.strokeStyle=ac; ctx.lineWidth=2.6; ctx.shadowColor=ac; ctx.shadowBlur=FX()?14:0; blobPath(0,0,44,44,6,2.6); ctx.stroke(); ctx.shadowBlur=0;
  const g=ctx.createRadialGradient(0,0,4,0,0,26); g.addColorStop(0,'#fff'); g.addColorStop(.4,ac); g.addColorStop(1,'#2a0813'); ctx.fillStyle=g; blobPath(0,0,24,24,3,5.1); ctx.fill();
  // detalhe por fase
  if(phi===0){ ctx.fillStyle='rgba(125,255,74,.5)'; for(let k=0;k<7;k++){ const a=b.rot*0.4+k/7*TAU; ctx.beginPath(); ctx.arc(Math.cos(a)*30,Math.sin(a)*30,4,0,TAU); ctx.fill(); } }
  else if(phi===1){ ctx.strokeStyle=hexA('#c6ff62',.6); ctx.lineWidth=2; for(let k=0;k<6;k++){ const a=k/6*TAU+Math.sin(time+k)*0.2; ctx.beginPath(); ctx.moveTo(Math.cos(a)*40,Math.sin(a)*40); ctx.lineTo(Math.cos(a)*62,Math.sin(a)*62); ctx.stroke(); } }
  else if(phi===2||phi===3){ if(target){ ctx.fillStyle=hexA('#ff5cf0',.5); for(let k=0;k<6;k++){ const a=b.rot*0.5+k/6*TAU; ctx.beginPath(); ctx.arc(Math.cos(a)*16,Math.sin(a)*16,2.4,0,TAU); ctx.fill(); } }
    if(b.mode!=='target'){ ctx.strokeStyle='#ffe1a8'; ctx.lineWidth=1.6; for(let k=0;k<3;k++){ const a=-1.1+k*1.1,bx=Math.cos(a)*44,by=Math.sin(a)*44-6; ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx,by-12); ctx.stroke(); ctx.fillStyle='#ffd34a'; ctx.beginPath(); ctx.moveTo(bx,by-12); ctx.lineTo(bx+11,by-9); ctx.lineTo(bx,by-6); ctx.closePath(); ctx.fill(); } } }
  else if(phi===4){ ctx.strokeStyle=hexA('#ffd34a',.6); ctx.lineWidth=1.6; for(let k=0;k<4;k++){ const a=b.rot+k*1.57; ctx.save(); ctx.rotate(a); ctx.beginPath(); ctx.ellipse(14,0,5,2,0,0,TAU); ctx.stroke(); ctx.restore(); } }
  else { ctx.fillStyle='rgba(255,92,240,.4)'; for(let k=0;k<8;k++){ const a=b.rot*0.5+k/8*TAU; ctx.beginPath(); ctx.arc(Math.cos(a)*20,Math.sin(a)*20,3,0,TAU); ctx.fill(); } }
  ctx.restore();
}
function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.fillStyle=PH.dk; ctx.fillRect(0,0,W,H);
  ctx.save(); if(shake>0) ctx.translate(rnd(-shake,shake),rnd(-shake,shake));
  for(const m of motes){ const y=(m.y*H+time*46*m.v)%H,x=m.x*W+Math.sin(time*0.55+m.ph)*18; ctx.globalAlpha=0.09+0.16*m.v; ctx.fillStyle=PH.vein; ctx.beginPath(); ctx.arc(x,y,m.s,0,TAU); ctx.fill(); }
  ctx.globalAlpha=1;
  drawWalls();
  if(inflammation>.02){ ctx.fillStyle='rgba(180,18,28,'+(inflammation*.10)+')'; ctx.fillRect(0,0,W,H); }
  drawGC();
  drawNets();
  drawAllies();
  drawResponders();
  drawPowerUps();
  drawEnemies(); drawBoss(); drawShip();
  // projéteis do jogador/aliados
  const _pbGlow=FX();
  for(const b of pb){
    if(b.kind==='ros'){ ctx.fillStyle='#d6ff78'; ctx.shadowColor='#d6ff78'; ctx.shadowBlur=_pbGlow?6:0; ctx.beginPath(); ctx.arc(b.x,b.y,b.size||2.6,0,TAU); ctx.fill(); ctx.shadowBlur=0; }
    else if(b.kind==='perf'){ ctx.fillStyle='#fff'; ctx.shadowColor='#ff6b4a'; ctx.shadowBlur=_pbGlow?8:0; ctx.fillRect(b.x-2,b.y-10,4,14); ctx.shadowBlur=0; }
    else if(b.kind==='engulf'){ ctx.strokeStyle=hexA(PH.ac,.9); ctx.fillStyle=hexA(PH.ac,.2); ctx.lineWidth=2; ctx.beginPath(); ctx.arc(b.x,b.y,b.size||7,0,TAU); ctx.fill(); ctx.stroke(); }
    else if(b.kind==='nk'){ ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(Math.atan2(b.vy,b.vx)+Math.PI/2); ctx.fillStyle='#eafffb'; ctx.shadowColor='#2ee6c8'; ctx.shadowBlur=_pbGlow?8:0; ctx.beginPath(); ctx.moveTo(0,-6); ctx.lineTo(4,0); ctx.lineTo(0,6); ctx.lineTo(-4,0); ctx.closePath(); ctx.fill(); ctx.shadowBlur=0; ctx.restore(); }
    else if(b.kind==='cyto'){ ctx.fillStyle='#ffe98a'; ctx.shadowColor='#ffd34a'; ctx.shadowBlur=_pbGlow?8:0; ctx.beginPath(); ctx.arc(b.x,b.y,3.2,0,TAU); ctx.fill(); ctx.shadowBlur=0;
      ctx.strokeStyle='rgba(255,211,74,.5)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(b.x,b.y,6,0,TAU); ctx.stroke(); }
    else if(b.kind==='allyshot'){ ctx.fillStyle='#fff2b0'; ctx.beginPath(); ctx.arc(b.x,b.y,2.4,0,TAU); ctx.fill(); }
    else if(b.kind==='ab'){ ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(Math.atan2(b.vy,b.vx)+Math.PI/2); ctx.strokeStyle='#bfe0ff'; ctx.lineWidth=2; ctx.shadowColor='#4aa8ff'; ctx.shadowBlur=_pbGlow?7:0; ctx.beginPath(); ctx.moveTo(0,4); ctx.lineTo(0,-1); ctx.moveTo(0,-1); ctx.lineTo(-4,-6); ctx.moveTo(0,-1); ctx.lineTo(4,-6); ctx.stroke(); ctx.shadowBlur=0; ctx.restore(); } }
  // projéteis inimigos
  for(const b of eb){ const sp=Math.hypot(b.vx,b.vy)||1,nx=b.vx/sp,ny=b.vy/sp,rot=Math.atan2(ny,nx),q=1+0.2*Math.sin(time*10+b.x*0.15);
    ctx.fillStyle='rgba(255,92,122,.35)'; ctx.beginPath(); ctx.ellipse(b.x,b.y,7*q,5.4*q,rot,0,TAU); ctx.fill();
    ctx.fillStyle='#ff5c7a'; ctx.beginPath(); ctx.ellipse(b.x,b.y,4.8*q,3.7*q,rot,0,TAU); ctx.fill();
    ctx.fillStyle='#ffe0e6'; ctx.beginPath(); ctx.arc(b.x-1,b.y-1,1.6,0,TAU); ctx.fill(); }
  for(const p of parts){ const a=Math.max(0,p.t/p.T); ctx.globalAlpha=a*0.4; ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*1.7,0,TAU); ctx.fill(); ctx.globalAlpha=a; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.fill(); }
  for(const s of shocks){ const k=Math.max(0,s.t/s.T); ctx.globalAlpha=k*0.6; ctx.strokeStyle=s.col; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(s.x,s.y,s.r*(1-k),0,TAU); ctx.stroke(); ctx.globalAlpha=1; }
  ctx.globalAlpha=1;
  for(const n of notes){ const a=Math.max(0,n.t/n.T); ctx.globalAlpha=a; ctx.font='900 10px Orbitron,monospace'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle=n.col; ctx.shadowColor=n.col; ctx.shadowBlur=FX()?8:0; ctx.fillText(n.txt,n.x,n.y); ctx.shadowBlur=0; }
  ctx.globalAlpha=1;
  ctx.restore();
  // vinheta avermelhada: escurece as bordas como se estivéssemos dentro do vaso
  const vg=ctx.createRadialGradient(W/2,H*0.5,H*0.16,W/2,H*0.5,H*0.9);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(0.7,hexA(PH.vein,0.05)); vg.addColorStop(1,'rgba(28,3,5,0.5)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  if((state==='play'||state==='boss')&&!movedHint&&!P.dead){ ctx.globalAlpha=0.55+0.45*Math.sin(time*4); ctx.fillStyle='#bfe0ff'; ctx.font='900 12px Orbitron,monospace'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('↕  ARRASTE EM TODAS AS DIREÇÕES  ↔',W/2,H*0.66); ctx.globalAlpha=1; }
  if(state==='bossintro'&&Math.floor(time*3)%2===0){ ctx.fillStyle='rgba(255,43,77,.9)'; ctx.font='900 15px Orbitron,monospace'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.shadowColor='#ff2b4d'; ctx.shadowBlur=FX()?14:0; ctx.fillText('⚠  '+PH.bnm+'  ⚠',W/2,H*0.42); ctx.shadowBlur=0; }
  if(flash>0){ ctx.fillStyle='rgba(255,255,255,'+(flash*0.4)+')'; ctx.fillRect(0,0,W,H); }
}
let movedHint=false;

/* ---------- Laço ---------- */
let last=performance.now();
function frame(now){ requestAnimationFrame(frame);
  const dt=Math.min(0.04,(now-last)/1000); last=now;
  try{ if(state!=='pause') update(dt); if(touchOn||keys.ArrowLeft||keys.ArrowRight||keys.ArrowUp||keys.ArrowDown) movedHint=true; render(); hud(); }catch(err){ console.error(err); } }

/* ---------- Resize ---------- */
let _lastW=0,_lastH=0,_rzT=0;
function doResize(){ const oldH=_lastH,yRatio=oldH?P.y/oldH:.74; dpr=Math.min(2,window.devicePixelRatio||1); W=window.innerWidth; H=window.innerHeight;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+'px'; cv.style.height=H+'px';
  P.x=clamp(P.x,16,W-16); P.y=clamp(H*yRatio,yTop(),yBot());
  if(gc){ gc.x=clamp(gc.x,60,W-60); gc.y=H*0.30; }
  initSegs(); initMotes(); _lastW=W; _lastH=H; if(boss) placeBossBar(true); }
function onResize(){ clearTimeout(_rzT); _rzT=setTimeout(()=>{ if(window.innerWidth!==_lastW||window.innerHeight!==_lastH) doResize(); },120); }
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',()=>setTimeout(doResize,260));

doResize();
showMenu();
requestAnimationFrame(frame);
</script>
